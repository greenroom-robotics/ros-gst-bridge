[workspace]
name = "gst_bridge"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
gst_bridge = { path = ".", extras = ["test"] }

[package]
name = "gst_bridge"
version = "0.1.2"
description = "Run ROS nodes in a gstreamer pipeline"
license = "LGPL-3.0-or-later"
authors = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = ">=0.5,<0.6"

[package.build.config]
mode = "pixi-native"
build-type = "ament_cmake"
distro = "kilted"
build-number = 3

[package.host-dependencies]
ros-kilted-ament-cmake = "*"
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
ros-kilted-sensor-msgs = "*"
ros-kilted-builtin-interfaces = "*"
pkg-config = "*"
# Oldest patch of the minor, so the run-export floor is >=1.28.0
gstreamer = "1.28.0.*"
gst-plugins-base = "1.28.0.*"
glib = "*"
lttng-ust = "*"
zlib = "*"
audio_msgs = { path = "../audio_msgs" }

[package.run-dependencies]
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
ros-kilted-sensor-msgs = "*"
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
glib = "*"
lttng-ust = "*"
audio_msgs = { path = "../audio_msgs" }

[package.extra-dependencies.test]
ros-dev-tools-meta = "*"
ros-kilted-rosidl-default-generators = "*"
ros-kilted-ament-lint-auto = "*"
# gstreamer-audio-1.0.pc has `Requires.private: gstreamer-tag-1.0, zlib`, and
# pkg-config refuses a module whose private requires are unresolvable. Without
# zlib.pc here the CMake `pkg_search_module(gstreamer-audio ...)` fails even
# though libz itself is present. It's in host-dependencies already, but those
# aren't part of the run closure the default env installs.
zlib = "*"

[tasks]
build = "colcon build"

# `test` runs build -> colcon-test -> test-result as a dependency chain. A
# failing step stops the chain and fails the task, so a build break or a test
# failure both surface — no exit codes to juggle.
[tasks.colcon-test]
cmd = "bash -c 'colcon test --event-handlers console_direct+ || [ $? -eq 5 ]'"
depends-on = ["build"]

[tasks.test]
cmd = "colcon test-result --all --verbose"
depends-on = ["colcon-test"]
